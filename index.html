<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1220"><link rel="manifest" href="manifest.json"><title>SGP Prêmio</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#eaf0f8;background:#0b1220}*{box-sizing:border-box}body{margin:0;background:#0b1220}.app{max-width:760px;margin:auto;padding:14px 14px 92px}h1{font-size:22px;margin:4px 0}.sub{color:#9fb0c5;font-size:13px}.card{background:#121d2d;border:1px solid #22344b;border-radius:16px;padding:14px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}label{font-size:12px;color:#9fb0c5;display:block;margin:0 0 5px}input,select,textarea,button{width:100%;border-radius:11px;border:1px solid #31445e;background:#0d1725;color:#fff;padding:11px;font-size:15px}textarea{min-height:76px}button{background:#1d6fe8;border:0;font-weight:700}.secondary{background:#23344a}.danger{background:#8f2d2d}.tabs{position:fixed;bottom:0;left:0;right:0;background:#0b1220eF;border-top:1px solid #22344b;display:flex;justify-content:center;z-index:5}.tabs div{max-width:760px;width:100%;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:8px}.tabs button{padding:10px 4px;background:transparent;color:#9fb0c5;font-size:12px}.tabs button.on{background:#17263a;color:white}.hidden{display:none}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#20344d;margin:2px;font-size:12px}.ok{color:#7ee2a8}.warn{color:#ffd166}.err{color:#ff8b8b}.row{border-bottom:1px solid #24364d;padding:10px 0}.row:last-child{border:0}.small{font-size:12px;color:#9fb0c5}.status{padding:8px;border-radius:10px;background:#0d1725;margin-top:8px}.loomgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;max-height:250px;overflow:auto}.loom{padding:8px 3px;background:#1a2a40;font-size:12px}.loom.sel{background:#1d6fe8}.toolbar{display:flex;gap:8px}.toolbar button{width:auto;flex:1}@media(max-width:520px){.grid{grid-template-columns:1fr}.loomgrid{grid-template-columns:repeat(3,1fr)}}
</style></head><body><div class="app"><h1>SGP Prêmio</h1><div class="sub" id="version"></div>
<section id="launch"><div class="card"><div class="grid"><div><label>Data</label><input id="date" type="date"></div><div><label>Tipo</label><select id="type"><option>FALTA</option><option>FÉRIAS</option><option>SAÍDA ANTECIPADA</option><option>ENTRADA ATRASADA</option><option>COBERTURA</option><option>DESLOCAMENTO LATERAL</option><option>REDISTRIBUIÇÃO</option><option>MUDANÇA DE CONJUNTO</option><option>NÃO OPERADOR</option><option>OUTROS</option></select></div><div class="full"><label>Pessoa titular</label><input id="person" list="people" placeholder="Digite nome"></div><div><label>Quem cobriu</label><input id="cover" list="people" placeholder="Opcional"></div><div><label>Destino da produção</label><select id="dest"><option value="cover">Pessoa que cobriu</option><option value="none">Sem atribuição individual</option><option value="holder">Titular</option></select></div><div><label>Início</label><input id="start" type="time"></div><div><label>Fim</label><input id="end" type="time"></div><div class="full"><label>Teares</label><div class="toolbar"><button class="secondary" id="auto" type="button">Carregar teares da pessoa</button><button class="secondary" id="clear" type="button">Limpar</button></div><div id="looms" class="loomgrid" style="margin-top:8px"></div></div><div class="full"><label>Observação</label><textarea id="note"></textarea></div></div><div id="validation" class="status small">Preencha a ocorrência.</div><button id="save" style="margin-top:10px">Validar e salvar</button></div></section>
<section id="history" class="hidden"><div class="card"><label>Buscar histórico</label><input id="search" placeholder="Nome, data, tear ou tipo"><div id="historyList"></div></div></section>
<section id="team" class="hidden"><div class="card"><label>Buscar pessoa ou tear</label><input id="teamSearch" placeholder="Ex.: Felipe ou TL017"><div id="teamList"></div></div></section>
<section id="sync" class="hidden"><div class="card"><h3>Sincronização</h3><div id="syncStatus" class="status small"></div><label style="margin-top:10px">Endpoint do Apps Script</label><input id="endpoint" placeholder="https://script.google.com/macros/s/.../exec"><label style="margin-top:10px">Chave de sincronização</label><input id="apiKey" type="password" autocomplete="off" placeholder="SGP_API_KEY"><button id="saveEndpoint" class="secondary" style="margin-top:8px">Salvar conexão</button><button id="syncNow" style="margin-top:8px">Sincronizar agora</button><div class="toolbar" style="margin-top:8px"><button id="export" class="secondary">Backup JSON</button><button id="importBtn" class="secondary">Restaurar</button></div><input id="importFile" type="file" accept="application/json" class="hidden"><p class="small">O app grava primeiro no aparelho. Endpoint e chave ficam somente neste dispositivo. Se estiver offline, os lançamentos permanecem pendentes até a próxima sincronização.</p></div></section>
<datalist id="people"></datalist></div><div class="tabs"><div><button data-tab="launch" class="on">Lançar</button><button data-tab="history">Histórico</button><button data-tab="team">Equipe</button><button data-tab="sync">Sincronizar</button></div></div>
<script>
let CFG, selected=new Set();const K='sgp_premio_occ_final_v1', EK='sgp_premio_endpoint', AK='sgp_premio_api_key';const $=x=>document.getElementById(x);const norm=s=>(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().trim().replace(/\s+/g,' ');function today(){return new Date().toISOString().slice(0,10)}function getOcc(){try{return JSON.parse(localStorage.getItem(K)||'[]')}catch{return[]}}function setOcc(v){localStorage.setItem(K,JSON.stringify(v))}function loomNum(t){return +t.replace(/\D/g,'')}function assignment(t,date){return CFG.loomAssignments.find(x=>x.tear===t&&(!x.start||date>=x.start)&&(!x.end||date<=x.end))}function personLooms(name,date){let n=norm(name);return CFG.loomAssignments.filter(x=>norm(x.name)===n&&(!x.start||date>=x.start)&&(!x.end||date<=x.end)).map(x=>x.tear).sort((a,b)=>loomNum(a)-loomNum(b))}function renderLooms(){let all=[...new Set(CFG.loomAssignments.map(x=>x.tear))].filter(x=>!CFG.excludedLooms.includes(x)).sort((a,b)=>loomNum(a)-loomNum(b));$('looms').innerHTML=all.map(t=>`<button type="button" class="loom ${selected.has(t)?'sel':''}" data-loom="${t}">${t}</button>`).join('');document.querySelectorAll('[data-loom]').forEach(b=>b.onclick=()=>{selected.has(b.dataset.loom)?selected.delete(b.dataset.loom):selected.add(b.dataset.loom);renderLooms();validate()})}function validate(){let errs=[],warn=[];let d=$('date').value,p=$('person').value,c=$('cover').value,tp=$('type').value;if(!d)errs.push('Informe a data.');if(!p)errs.push('Informe a pessoa.');if(!selected.size)errs.push('Selecione ao menos um tear.');if(['FALTA','FÉRIAS'].includes(tp)&&$('dest').value==='cover'&&!c)errs.push('Informe quem cobriu ou altere o destino da produção.');if(c&&norm(c)===norm(p))errs.push('Titular e cobertura não podem ser a mesma pessoa.');selected.forEach(t=>{if(CFG.excludedLooms.includes(t))errs.push(`${t} é excluído do SGP.`);let a=assignment(t,d);if(a&&p&&norm(a.name)!==norm(p)&&['FALTA','FÉRIAS','SAÍDA ANTECIPADA','ENTRADA ATRASADA'].includes(tp))warn.push(`${t}: titular cadastrado em ${d.split('-').reverse().join('/')} é ${a.name}.`)});let occ=getOcc();for(let o of occ){if(o.date===d&&o.status!=='SUBSTITUÍDA'){let overlap=o.looms.filter(t=>selected.has(t));if(overlap.length&&norm(o.person)===norm(p)&&o.type===tp)warn.push(`Possível duplicidade: ${overlap.join(', ')} já consta em ocorrência ${o.id}.`)}}$('validation').className='status small '+(errs.length?'err':warn.length?'warn':'ok');$('validation').innerHTML=errs.length?errs.join('<br>'):warn.length?warn.join('<br>'):'Ocorrência consistente para salvar.';return !errs.length}function save(){if(!validate())return;let occ=getOcc();let id='OC-'+Date.now();occ.push({id,date:$('date').value,type:$('type').value,person:$('person').value.trim(),cover:$('cover').value.trim(),destination:$('dest').value,start:$('start').value,end:$('end').value,looms:[...selected].sort((a,b)=>loomNum(a)-loomNum(b)),note:$('note').value.trim(),status:'VALIDADA',createdAt:new Date().toISOString(),sync:'PENDENTE'});setOcc(occ);selected.clear();$('cover').value='';$('note').value='';$('start').value='';$('end').value='';renderLooms();validate();renderHistory();updateSync();alert('Ocorrência salva.')}
function renderHistory(){let q=norm($('search')?.value||'');let a=getOcc().slice().reverse().filter(o=>!q||norm(JSON.stringify(o)).includes(q));$('historyList').innerHTML=a.length?a.map(o=>`<div class="row"><b>${o.date.split('-').reverse().join('/')} · ${o.type}</b><div>${o.person}</div><div class="small">${o.looms.join(', ')}${o.cover?' · Cobertura: '+o.cover:''}</div><span class="pill">${o.sync}</span></div>`).join(''):'<p class="small">Nenhuma ocorrência.</p>'}function renderTeam(){let q=norm($('teamSearch')?.value||'');let groups={};CFG.loomAssignments.forEach(x=>{let k=x.name;groups[k]=groups[k]||[];groups[k].push(x)});$('teamList').innerHTML=Object.entries(groups).filter(([n,a])=>!q||norm(n+' '+a.map(x=>x.tear).join(' ')).includes(q)).sort().map(([n,a])=>`<div class="row"><b>${n}</b><div class="small">${a.sort((x,y)=>loomNum(x.tear)-loomNum(y.tear)).map(x=>x.tear+(x.start?' desde '+x.start.split('-').reverse().join('/'):'')+(x.end?' até '+x.end.split('-').reverse().join('/'):'')).join(' · ')}</div></div>`).join('')}
function toApiOccurrence(o){return {id:o.id,data:o.date||'',turno:o.turno||'',matricula:o.matricula||'',nome:o.person||'',tipo:o.type||'',teares:o.looms||[],coberturaMatricula:o.coverMatricula||'',coberturaNome:o.cover||'',tipoCobertura:o.cover?'COBERTURA':'',destinoProducao:o.destination||'',horaInicio:o.start||'',horaFim:o.end||'',observacao:o.note||'',status:o.status||'VALIDADO'}}
async function syncNow(){
  const ep=localStorage.getItem(EK)||'';
  const key=localStorage.getItem(AK)||'';

  if(!ep||!key){
    alert('Configure o endpoint e a chave de sincronização.');
    return;
  }

  let all=getOcc();
  const pending=all.filter(o=>o.sync!=='SINCRONIZADO');

  if(!pending.length){
    alert('Nada pendente para envio.');
    return;
  }

  const pendingIds=new Set(pending.map(o=>o.id));

  all.forEach(o=>{
    if(pendingIds.has(o.id)){
      o.sync='SINCRONIZANDO';
      delete o.syncError;
    }
  });
  setOcc(all);
  updateSync();
  renderHistory();

  const pacote={
    apiKey:key,
    ocorrencias:pending.map(toApiOccurrence)
  };

  const token='SGP-'+Date.now()+'-'+Math.random().toString(36).slice(2);
  let iframe=null;
  let form=null;
  let timer=null;

  try{
    const resposta=await new Promise((resolve,reject)=>{
      iframe=document.createElement('iframe');
      iframe.name='sgp_sync_frame_'+Date.now();
      iframe.style.display='none';
      document.body.appendChild(iframe);

      form=document.createElement('form');
      form.method='POST';
      form.action=ep;
      form.target=iframe.name;
      form.style.display='none';

      const campos={
        transport:'iframe',
        token:token,
        payload:JSON.stringify(pacote)
      };

      Object.entries(campos).forEach(([nome,valor])=>{
        const input=document.createElement('input');
        input.type='hidden';
        input.name=nome;
        input.value=valor;
        form.appendChild(input);
      });

      document.body.appendChild(form);

      const onMessage=(event)=>{
        const data=event.data;

        if(
          !data ||
          data.source!=='SGP_PREMIO_SYNC' ||
          data.token!==token
        ){
          return;
        }

        window.removeEventListener('message',onMessage);
        clearTimeout(timer);
        resolve(data.response);
      };

      window.addEventListener('message',onMessage);

      timer=setTimeout(()=>{
        window.removeEventListener('message',onMessage);
        reject(new Error('O Apps Script não confirmou o recebimento em 20 segundos.'));
      },20000);

      form.submit();
    });

    if(!resposta||typeof resposta!=='object'){
      throw new Error('Resposta inválida do Apps Script.');
    }

    const okIds=new Set(
      (resposta.resultados||[])
        .filter(x=>x.ok)
        .map(x=>String(x.id))
    );

    const erros=new Map(
      (resposta.erros||[])
        .map(x=>[String(x.id),x.erro])
    );

    all=getOcc();

    all.forEach(o=>{
      if(okIds.has(String(o.id))){
        o.sync='SINCRONIZADO';
        delete o.syncError;
      }else if(pendingIds.has(o.id)){
        o.sync='ERRO';
        o.syncError=
          erros.get(String(o.id)) ||
          resposta.erro ||
          'O Apps Script não confirmou este registro.';
      }
    });

    setOcc(all);
    updateSync();
    renderHistory();

    if(resposta.ok===true && okIds.size===pending.length){
      alert(`Sincronização confirmada: ${okIds.size} registro(s) gravado(s) pelo SGP.`);
    }else{
      alert(`Sincronização parcial: ${okIds.size} confirmado(s), ${pending.length-okIds.size} com erro.`);
    }

  }catch(e){
    all=getOcc();
    all.forEach(o=>{
      if(pendingIds.has(o.id)){
        o.sync='ERRO';
        o.syncError=e.message;
      }
    });
    setOcc(all);
    updateSync();
    renderHistory();

    alert(
      'Sincronização não confirmada: '+e.message+
      '\nOs dados continuam salvos no aparelho.'
    );
  }finally{
    if(timer)clearTimeout(timer);
    try{if(form)form.remove()}catch(_){}
    try{if(iframe)iframe.remove()}catch(_){}
  }
}
function updateSync(){let a=getOcc(),p=a.filter(x=>x.sync!=='SINCRONIZADO').length,ep=localStorage.getItem(EK)||'',key=localStorage.getItem(AK)||'';$('syncStatus').innerHTML=`Registros: <b>${a.length}</b> · Pendentes/erro: <b>${p}</b><br>Endpoint: ${ep?'configurado':'não configurado'} · Chave: ${key?'configurada':'não configurada'}`;$('endpoint').value=ep;$('apiKey').value=key}
function backup(){let blob=new Blob([JSON.stringify({version:CFG.version,exportedAt:new Date().toISOString(),occurrences:getOcc()},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='SGP_Premio_Backup_'+today()+'.json';a.click();URL.revokeObjectURL(a.href)}async function restore(f){try{let j=JSON.parse(await f.text());if(!Array.isArray(j.occurrences))throw Error('Backup inválido');if(!confirm(`Restaurar ${j.occurrences.length} registros? Isso substituirá os dados locais.`))return;setOcc(j.occurrences);renderHistory();updateSync();alert('Backup restaurado.')}catch(e){alert(e.message)}}async function init(){CFG=await fetch('config.json').then(r=>r.json());$('version').textContent=`Versão ${CFG.version} · Sync 2.0.2 · período 21→20 · TL113/TL114 excluídos`;$('date').value=today();$('people').innerHTML=CFG.teamNames.map(n=>`<option value="${n}">`).join('');renderLooms();renderHistory();renderTeam();updateSync();validate();if('serviceWorker'in navigator){navigator.serviceWorker.register('./sw.js?v=2.0.3',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{});}}
document.addEventListener('click',e=>{let t=e.target.closest('[data-tab]');if(t){document.querySelectorAll('section').forEach(s=>s.classList.add('hidden'));$(t.dataset.tab).classList.remove('hidden');document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('on',x===t));if(t.dataset.tab==='history')renderHistory();if(t.dataset.tab==='team')renderTeam();if(t.dataset.tab==='sync')updateSync();}});$('save').onclick=save;$('auto').onclick=()=>{selected=new Set(personLooms($('person').value,$('date').value));renderLooms();validate()};$('clear').onclick=()=>{selected.clear();renderLooms();validate()};['date','person','cover','type','dest','start','end'].forEach(id=>$(id).addEventListener('change',validate));$('search').oninput=renderHistory;$('teamSearch').oninput=renderTeam;$('saveEndpoint').onclick=()=>{let v=$('endpoint').value.trim(),k=$('apiKey').value.trim();if(v&&!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/i.test(v)){alert('Use a URL /exec do Apps Script.');return}if(!v||!k){alert('Informe o endpoint e a chave.');return}localStorage.setItem(EK,v);localStorage.setItem(AK,k);updateSync();alert('Conexão salva neste aparelho.');};$('syncNow').onclick=syncNow;$('export').onclick=backup;$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=e=>e.target.files[0]&&restore(e.target.files[0]);init();
</script></body></html>
